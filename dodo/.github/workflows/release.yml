name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from TOC
        id: version
        run: |
          VERSION=$(grep "## Version:" dodo.toc | sed 's/## Version: *//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create ZIP
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          cd "$(dirname $GITHUB_WORKSPACE)"
          zip -r dodo.zip dodo/ \
            --exclude "dodo/.git/*" \
            --exclude "dodo/2temp/*" \
            --exclude "dodo/*.code-workspace" \
            --exclude "dodo/Agents.md" \
            --exclude "dodo/CLAUDE.md" \
            --exclude "dodo/skills-lock.json" \
            --exclude "dodo/memo.txt" \
            --exclude "dodo/.github/*"
          mv dodo.zip $GITHUB_WORKSPACE/

      - name: Create Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: dodo v${{ steps.version.outputs.version }}
          files: dodo.zip
          generate_release_notes: true
          make_latest: true
