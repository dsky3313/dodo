name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from TOC
        id: version
        run: |
          VERSION=$(grep "## Version:" dodo.toc | sed 's/## Version: *//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create ZIP
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          set -e
          mkdir -p /tmp/dodo_build/dodo
          cp -r . /tmp/dodo_build/dodo/
          rm -rf /tmp/dodo_build/dodo/.git
          rm -rf /tmp/dodo_build/dodo/2temp
          rm -rf /tmp/dodo_build/dodo/.github
          rm -f /tmp/dodo_build/dodo/Agents.md
          rm -f /tmp/dodo_build/dodo/CLAUDE.md
          rm -f /tmp/dodo_build/dodo/skills-lock.json
          rm -f /tmp/dodo_build/dodo/memo.txt
          find /tmp/dodo_build -name "*.code-workspace" -delete
          cd /tmp/dodo_build
          zip -r /tmp/dodo.zip dodo/
          ls -lh /tmp/dodo.zip

      - name: Create Release and Upload
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          TAG="v${{ steps.version.outputs.version }}"

          # 릴리즈 생성 및 upload_url 추출
          UPLOAD_URL=$(gh api repos/$REPO/releases \
            -X POST \
            -f tag_name="$TAG" \
            -f name="dodo v${{ steps.version.outputs.version }}" \
            -F generate_release_notes=true \
            -f make_latest=true \
            --jq '.upload_url' | sed 's/{?name,label}//')
          echo "Upload URL: $UPLOAD_URL"

          # dodo.zip 업로드
          HTTP_CODE=$(curl -s -o /tmp/upload_result.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            "${UPLOAD_URL}?name=dodo.zip" \
            --data-binary @/tmp/dodo.zip)
          echo "HTTP: $HTTP_CODE"
          cat /tmp/upload_result.json
          [ "$HTTP_CODE" = "201" ] || exit 1
