name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from TOC
        id: version
        run: |
          VERSION=$(grep "## Version:" dodo.toc | sed 's/## Version: *//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create ZIP
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          set -e
          mkdir -p /tmp/dodo_build/dodo
          cp -r . /tmp/dodo_build/dodo/
          rm -rf /tmp/dodo_build/dodo/.git
          rm -rf /tmp/dodo_build/dodo/2temp
          rm -rf /tmp/dodo_build/dodo/.github
          rm -f /tmp/dodo_build/dodo/Agents.md
          rm -f /tmp/dodo_build/dodo/CLAUDE.md
          rm -f /tmp/dodo_build/dodo/skills-lock.json
          rm -f /tmp/dodo_build/dodo/memo.txt
          find /tmp/dodo_build -name "*.code-workspace" -delete
          cd /tmp/dodo_build
          zip -r /tmp/dodo.zip dodo/
          ls -lh /tmp/dodo.zip

      - name: Create Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          TAG="v${{ steps.version.outputs.version }}"

          gh release create "$TAG" \
            --title "dodo v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest

          # 릴리즈 ID 조회
          RELEASE_ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id')
          echo "Release ID: $RELEASE_ID"

          # 자동 생성된 assets 확인 및 삭제
          sleep 3
          echo "=== 현재 assets ==="
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq '.[].name'

          ASSET_IDS=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq '.[].id')
          for ID in $ASSET_IDS; do
            echo "asset $ID 삭제"
            gh api "repos/$REPO/releases/assets/$ID" -X DELETE
          done

          # dodo.zip 업로드
          echo "=== dodo.zip 업로드 ==="
          HTTP=$(curl -s -o /tmp/res.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=dodo.zip" \
            --data-binary @/tmp/dodo.zip)
          echo "HTTP: $HTTP"
          cat /tmp/res.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('name:', d.get('name'), 'size:', d.get('size'))" 2>/dev/null || cat /tmp/res.json
          [ "$HTTP" = "201" ] || exit 1
